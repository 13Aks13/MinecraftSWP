name: minecraft-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7
    container_name: mc-traefik
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-proxy-ro:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=minecraft-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=0
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=0
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=0
      - --certificatesresolvers.myresolver.acme.tlschallenge=true
      - --certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - ./letsencrypt:/letsencrypt
    networks:
      - proxy
      - docker-api-ro
    depends_on:
      docker-proxy-ro:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  docker-proxy-ro:
    # Read-only discovery for Traefik. Pin a specific version or digest in production.
    image: tecnativa/docker-socket-proxy:latest
    container_name: mc-docker-proxy-ro
    environment:
      # Traefik's docker provider only lists/inspects containers and networks and
      # watches events (EVENTS, PING and VERSION are allowed by default).
      CONTAINERS: 1
      NETWORKS: 1
      # POST stays 0: no start/stop/exec/create is possible through this instance.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api-ro
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    container_name: mc-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mc_platform}
      POSTGRES_USER: ${DB_USER:-mc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mc} -d ${DB_NAME:-mc_platform}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: mc-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  docker-proxy:
    # Pin a specific version or digest in production.
    image: tecnativa/docker-socket-proxy:latest
    container_name: mc-docker-proxy
    environment:
      # Only what DockerService uses: inspect/stats/logs, exec (send-command), start/stop.
      CONTAINERS: 1
      POST: 1
      EXEC: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

  core-api:
    build:
      context: ..
      dockerfile: apps/core-api/Dockerfile
    container_name: mc-platform-api
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RUN_WORKER: "false"
      STORAGE_ROOT: /storage
      DATA_ROOT: /data
      BEDROCK_CONTAINER: mc-bedrock
      BEDROCK_LEVEL_NAME: active
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - ./storage:/storage
      - ./data:/data
    networks:
      - proxy
      - internal
      - docker-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: minecraft-proxy
      traefik.http.routers.mc-api.rule: PathPrefix(`/api`) || PathPrefix(`/socket.io`)
      traefik.http.routers.mc-api.entrypoints: web
      traefik.http.routers.mc-api.priority: "100"
      traefik.http.services.mc-api.loadbalancer.server.port: "3000"
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: mc-platform-worker
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RUN_WORKER: "true"
      STORAGE_ROOT: /storage
      DATA_ROOT: /data
    volumes:
      - ./storage:/storage
      - ./data:/data
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging

  web-app:
    build:
      context: ..
      dockerfile: apps/web-app/Dockerfile
    container_name: mc-platform-web
    networks:
      - proxy
    depends_on:
      core-api:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: minecraft-proxy
      traefik.http.routers.mc-web.rule: Host(`${APP_HOST:?APP_HOST is required}`)
      traefik.http.routers.mc-web.entrypoints: websecure
      traefik.http.routers.mc-web.tls: "true"
      traefik.http.routers.mc-web.tls.certresolver: myresolver
      traefik.http.routers.mc-web.priority: "10"
      traefik.http.services.mc-web.loadbalancer.server.port: "80"
    restart: unless-stopped
    logging: *default-logging

  bedrock-server:
    image: itzg/minecraft-bedrock-server
    container_name: mc-bedrock
    environment:
      EULA: "TRUE"
      LEVEL_NAME: "active"
      # TRANSPORT: "nethernet"
      TRANSPORT: "raknet"
      ALLOW_OUTBOUND_SCRIPT_MODULES: "true"
      # SERVER_UDP_PORTS: "19140-19155:19140-19155"
      UID: "1000"
      GID: "1000"
    ports:
      #- "19132:19132"
      - "19132:19132/udp"
      #- "19140-19155:19140-19155/udp"
    volumes:
      - ./data:/data
    networks:
      - backend
    stdin_open: true
    tty: false
    restart: unless-stopped
    logging: *default-logging

networks:
  proxy:
    name: minecraft-proxy
  internal:
    name: minecraft-internal
  backend:
    name: minecraft-backend
  docker-api:
    name: minecraft-docker-api
    # No outbound access; only core-api and docker-proxy are attached.
    internal: true
  docker-api-ro:
    name: minecraft-docker-api-ro
    # Only traefik and docker-proxy-ro are attached.
    internal: true

volumes:
  pgdata:
    name: minecraft-pgdata
