name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. 1.19.0). Leave empty to deploy the latest published release."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release to production
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: resolve-tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "==> No tag specified, resolving latest release from GitHub API"
            TAG=$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | sed -n 's/.*"tag_name": "\([^"]*\)".*/\1/p')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a release tag. Pass the 'tag' input or publish a release first."
            exit 1
          fi
          echo "==> Will deploy release: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: RELEASE_TAG
          # Fail the job (and the release pipeline) as soon as one command fails,
          # instead of silently rebuilding whatever stale sources are on disk.
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            DEPLOY_DIR=/home/ubuntu/minecraft-swp
            REPO_URL=https://github.com/13Aks13/MinecraftSWP.git
            TAG="${RELEASE_TAG:?RELEASE_TAG is not set}"

            echo "==> Deploying release ${TAG}"

            if ! command -v git >/dev/null 2>&1; then
              echo "==> ERROR: git is not installed on the server" >&2
              exit 1
            fi

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # The directory was historically populated from release tarballs and has
            # no .git. Bootstrap a work tree in place: runtime state (.env, infra/data,
            # infra/storage, infra/letsencrypt) is untracked and therefore preserved.
            if [ ! -d .git ]; then
              echo "==> No git work tree found, initialising in place"
              git init -q
            fi

            echo "==> Configuring remote origin"
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$REPO_URL"
            else
              git remote add origin "$REPO_URL"
            fi

            echo "==> Fetching ${TAG}"
            git fetch --prune --tags --force origin

            echo "==> Checking out ${TAG}"
            git -c advice.detachedHead=false checkout --force --detach "refs/tags/${TAG}"

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Working tree does not match ${TAG}:" >&2
              git status --porcelain --untracked-files=no >&2
              exit 1
            fi

            echo "==> Source is at $(git rev-parse --short HEAD) (${TAG})"

            # .env is runtime configuration and must already exist on the server
            # with production values. It is NOT part of the repository.
            if [ ! -f .env ]; then
              echo "==> ERROR: .env not found in $DEPLOY_DIR" >&2
              echo "Create it manually (copy .env.example and set production values) before deploying." >&2
              exit 1
            fi

            # No `down` here: `up` recreates changed services and keeps postgres,
            # redis and the proxy running, so the outage window stays minimal.
            echo "==> Running docker compose up"
            docker compose -f infra/docker-compose.yml --env-file .env \
              up -d --build --remove-orphans --wait --wait-timeout 1200

            echo "==> Verifying the API through the proxy"
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1/api/v1/health >/dev/null; then
                echo "==> Health check passed"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Health check failed after 30 attempts" >&2
                docker compose -f infra/docker-compose.yml --env-file .env ps >&2
                exit 1
              fi
              sleep 5
            done

            echo "$TAG" > .deployed-version

            # Rebuilt images leave the previous ones dangling; without this the disk
            # fills up after a few releases.
            docker image prune -f >/dev/null

            docker compose -f infra/docker-compose.yml --env-file .env ps
            echo "==> Release ${TAG} deployed"
