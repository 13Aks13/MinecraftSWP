name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ci:
    name: CI Checks (Build, Lint, Typecheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Package Versions
        run: pnpm version:check

      - name: Build Shared Package
        run: pnpm --filter @mc/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint & Format Check
        run: |
          pnpm lint
          pnpm format:check

      - name: Build
        run: pnpm build

  test:
    name: Tests (Postgres + Redis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mc
          POSTGRES_PASSWORD: mc
          POSTGRES_DB: mc_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mc -d mc_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: mc
      DB_PASSWORD: mc
      DB_NAME: mc_platform_test
      REDIS_URL: redis://localhost:6379
      # Throw-away values for the ephemeral CI database only.
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMe123!
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Package
        run: pnpm --filter @mc/shared build

      - name: Apply Database Migrations
        run: pnpm --filter @mc/core-api db:migrate

      - name: Run Tests
        run: pnpm test

  review:
    name: AI Code Review
    needs: [ci, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Code Review
        uses: KonstZiv/ai-code-reviewer@v1
        with:
          github_token: ${{ secrets.BOT_PAT }}
          google_api_key: ${{ secrets.GEMINI_API_KEY }}
          llm_provider: gemini
          gemini_model: gemini-2.0-flash
          llm_fallback_provider: gemini
          mistral_api_key: ${{ secrets.MISTRAL_API_KEY }}

      - name: Auto-approve PR
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          gh pr review ${{ github.event.pull_request.html_url }} --approve -b "CI checks and AI Code Review passed. Auto-approved."
